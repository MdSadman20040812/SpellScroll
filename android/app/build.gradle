plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.spellscroll.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.spellscroll.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        debug {
            // 127.0.0.1 works seamlessly for USB-connected physical devices (via adb reverse tcp:8000 tcp:8000)
            // as well as local network IPs via -PspellscrollUrl=http://192.168.1.107:8000
            buildConfigField "String", "SPELLSCROLL_URL",
                    "\"${project.findProperty('spellscrollUrl') ?: 'http://127.0.0.1:8000'}\""
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Point this at the deployed instance before shipping a release.
            buildConfigField "String", "SPELLSCROLL_URL",
                    "\"${project.findProperty('spellscrollUrl') ?: 'https://spellscroll.app'}\""
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "SpellScroll-v${variant.versionName}-${variant.buildType.name}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.8.0'
    implementation 'androidx.browser:browser:1.7.0'

    // Native Material and UI Components
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Async Networking & Serialization
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Image Loading with Disk & Memory Cache
    implementation 'io.coil-kt:coil:2.5.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
