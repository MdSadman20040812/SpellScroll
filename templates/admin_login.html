{% extends 'base.html' %}

{% block title %}Sanctum access — SpellScroll{% endblock %}

{% block content %}
<div class="container container--narrow" style="padding-block: var(--space-20)">
  <div class="panel stack" style="max-width: 420px; margin-inline: auto">
    <div class="stack-sm">
      <p class="eyebrow eyebrow--accent">Restricted</p>
      <h1 class="title-2">Sanctum access</h1>
      <p class="body-sm muted">Operator credentials are required beyond this point.</p>
    </div>

    <form method="post" action="{% url 'admin_login' %}" class="stack">
      {% csrf_token %}
      <div class="field">
        <label class="field__label" for="admin-username">Operator</label>
        <input class="input" id="admin-username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label class="field__label" for="admin-password">Passphrase</label>
        <input class="input" id="admin-password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn--primary btn--block btn--lg" type="submit">Unseal</button>
    </form>

    <a class="btn btn--ghost btn--block" href="{% url 'landing' %}">Back to SpellScroll</a>
  </div>
</div>
{% endblock %}
